</script><script>window.WordAssetManifest={"index.wasm": {"file": "wasm.afc6a3d4c975b539.data", "bytes": 9237412, "rawBytes": 38034280, "mime": "application/wasm"}, "index.data": {"file": "data.03c593d240fe1321.data", "bytes": 46207407, "rawBytes": 47261196, "mime": "application/octet-stream"}};</script><script>/* Compressed Godot downloads; cache only immutable game assets, never saves. */
(()=>{
 const manifest=window.WordAssetManifest,cacheName='lxya-engine-assets-v1';
 const progress=new Map();
 const totalBytes=Object.values(manifest).reduce((n,v)=>n+v.bytes,0);
 let reportedPercent=-1,reportedCached=false;
 function report(name,loaded,total,cached=false){
  progress.set(name,{loaded,total,cached});
  const values=[...progress.values()];
  const combined=values.reduce((n,v)=>n+v.loaded,0),percent=Math.floor(combined*100/totalBytes);
  const allCached=values.length===Object.keys(manifest).length&&values.every(v=>v.cached);
  if(percent===reportedPercent&&allCached===reportedCached)return;
  reportedPercent=percent;reportedCached=allCached;
  window.dispatchEvent(new CustomEvent('toy-assets-progress',{detail:{loaded:combined,total:totalBytes,cached:allCached}}));
 }
 window.WordClearAssetCache=async()=>{try{await caches.delete(cacheName);}catch{}};
 window.WordAssetFetch=async file=>{
  const name=String(file).split('/').pop(),asset=manifest[name];
  if(!asset)return fetch(file);
  if(typeof DecompressionStream==='undefined')throw Error('请更新 B站 App 或浏览器：当前内核不支持游戏资源解压。');
  const url=new URL(asset.file,location.href).href;
  let cache,response,cached=false,compressed=null;
  try{cache=await caches.open(cacheName);response=await cache.match(url);cached=!!response;}catch{/* Private mode / quota: network still works. */}
  if(!response){
   response=await fetch(url);
   if(!response.ok)throw Error('资源下载失败（'+response.status+'），请重试。');
   if(cache){try{compressed=new Uint8Array(asset.bytes);}catch{/* The game can stream on low-memory devices without a cache write. */}}
  }
  let loaded=0;
  report(name,0,asset.bytes,cached);
  const tracked=response.body.pipeThrough(new TransformStream({
   transform(chunk,controller){
    if(loaded+chunk.byteLength>asset.bytes)throw Error('游戏资源大小不符，请重新下载。');
    if(compressed)compressed.set(chunk,loaded);
    loaded+=chunk.byteLength;report(name,loaded,asset.bytes,cached);controller.enqueue(chunk);
   },
   flush(){if(loaded!==asset.bytes)throw Error('游戏资源不完整，请重新下载。');}
  }));
  const decoded=tracked.pipeThrough(new DecompressionStream('gzip')).getReader();
  const body=new ReadableStream({
   async pull(controller){
    try{
     const piece=await decoded.read();
     if(piece.done){
      if(compressed){
       try{await cache.put(url,new Response(compressed,{headers:{'Content-Type':'application/octet-stream'}}));}catch{/* Full or read-only storage still permits play. */}
       compressed=null;
      }
      controller.close();
     }else controller.enqueue(piece.value);
    }catch(error){
     compressed=null;
     if(cached)await cache.delete(url).catch(()=>{});
     controller.error(error);
    }
   },
   cancel:reason=>decoded.cancel(reason)
  });
  return new Response(body,{headers:{'Content-Type':asset.mime,'Content-Length':String(asset.rawBytes)}});
 };
})();

(() => {
  const files = {"01":"operator-art/operator-01.b34545ee9278c33c.jpg","02":"operator-art/operator-02.735d632f94d24648.jpg","03":"operator-art/operator-03.05acdafef63a6f6d.jpg","04":"operator-art/operator-04.e590f08634cac1a5.jpg","05":"operator-art/operator-05.07e9f6187ffdc7b7.jpg","06":"operator-art/operator-06.15182fa7a335ed93.jpg","07":"operator-art/operator-07.5cdddff47902a3e1.jpg"};
  let active;

  function cancel() {
    if (!active) return;
    active.controller.abort();
    active = undefined;
  }

  async function request(key, done) {
    cancel();
    const file = files[key];
    if (!file) { done(key, null); return; }
    const job = {controller: new AbortController()};
    active = job;
    const timer = setTimeout(() => job.controller.abort(), 12000);
    let data = null;
    try {
      const response = await fetch(new URL(file, document.baseURI), {
        signal: job.controller.signal, cache: 'force-cache'
      });
      if (response.ok) {
        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes[0] === 0xff && bytes[1] === 0xd8) data = bytes;
      }
    } catch { /* The game keeps the bundled portrait available. */ }
    finally { clearTimeout(timer); }
    if (active === job) {
      active = undefined;
      done(key, data);
    }
  }

  window.WordOperatorArt = {request, cancel};
})();
